    var_kwargs_schema: null
  close:
    name: close
    description: Closes the BMG plate tray
    args: {}
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
    accepts_var_args: false
    accepts_var_kwargs: false
    var_args_schema: null
    var_kwargs_schema: null
  set_temp:
    name: set_temp
    description: Sets the temperature on the BMG microplate reader
    args:
      temp:
        name: temp
        description: ''
        argument_type: float
        required: true
        default: null
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
    accepts_var_args: false
    accepts_var_kwargs: false
    var_args_schema: null
    var_kwargs_schema: null
  run_assay:
    name: run_assay
    description: Runs an assay on the BMG plate reader
    args:
