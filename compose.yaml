name: bmg_module
services:
  bmg_module:
    container_name: bmg_module
    image: ghcr.io/ad-sdl/bmg_module
    build:
      context: .
      tags:
        - ghcr.io/ad-sdl/bmg_module:latest
        - ghcr.io/ad-sdl/bmg_module:dev
    volumes:
      - ./src:/home/app/bmg_module/src
      - ./tests:/home/app/bmg_module/tests
    command: python -m bmg_module --port 2000
    ports:
      - 2000:2000
#####################
# WEI Core Services #
#####################
  bmg_wei_server:
    image: ghcr.io/ad-sdl/wei
    container_name: bmg_wei_server
    ports:
      - 8000:8000
    environment:
      - PYTHONUNBUFFERED=1 # Fix weird bug with empty logging
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
    volumes:
      - ./workcells:/workcells
    command: python3 -m wei.server --workcell /workcells/test.workcell.yaml
    depends_on:
      - bmg_wei_redis
  bmg_wei_redis:
    image: redis
    container_name: bmg_wei_redis
    ports:
      - 6379:6379
    command: redis-server --save 60 1 --loglevel warning
